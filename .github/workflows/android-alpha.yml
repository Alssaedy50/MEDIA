name: MEDIA Android Alpha

on:
  push:
    branches: ["agent/android-alpha"]
  pull_request:

jobs:
  android-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Android debug APK
        working-directory: android
        run: gradle :android-app:assembleDebug
      - name: Run Android unit tests
        working-directory: android
        run: gradle :android-app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: media-android-alpha-debug
          path: android-app/build/outputs/apk/debug/android-app-debug.apk