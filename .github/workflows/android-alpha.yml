name: MEDIA Android Alpha

on:
  push:
    branches: ["main", "agent/android-alpha", "feature/offline-alpha"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Validate bundled Hematology knowledge
        run: |
          count=$(find android/assets/knowledge/hematology -type f -name "*.json" | wc -l)
          test "$count" -eq 51
          echo "Validated $count Hematology JSON records"

      - name: Validate offline-only manifest
        run: |
          ! grep -Eq '<uses-permission[^>]+android:name="android.permission.INTERNET"' android-app/src/main/AndroidManifest.xml
          echo "Validated: INTERNET permission is not declared"

      - name: Build Android debug APK
        working-directory: android
        run: gradle :android-app:assembleDebug

      - name: Verify APK contains offline knowledge
        run: |
          set -eu
          apk=android-app/build/outputs/apk/debug/android-app-debug.apk
          if [ ! -f "$apk" ]; then
            echo "APK not found at $apk" >&2
            echo "Build outputs:" >&2
            find . -path ./.git -prune -o -name '*.apk' -print >&2
            exit 1
          fi
          rm -rf /tmp/media-apk-check
          mkdir -p /tmp/media-apk-check
          unzip -q "$apk" -d /tmp/media-apk-check
          asset_dir=/tmp/media-apk-check/assets/knowledge/hematology
          if [ ! -d "$asset_dir" ]; then
            echo "Missing assets/knowledge/hematology inside the APK" >&2
            exit 1
          fi
          count=$(find "$asset_dir" -type f -name "*.json" | wc -l)
          echo "APK contains $count bundled Hematology JSON entries"
          test "$count" -eq 51

      - name: Verify APK metadata
        run: |
          set -eu
          apk=android-app/build/outputs/apk/debug/android-app-debug.apk
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          echo "$badging" | grep -F "package: name='com.media.android'"
          echo "$badging" | grep -F "versionName='0.2.0'"

      - name: Run Android unit tests
        working-directory: android
        run: gradle :android-app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: media-android-alpha-debug
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          retention-days: 30