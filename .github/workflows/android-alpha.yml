name: MEDIA Android Alpha

on:
  push:
    branches: ["main", "agent/android-alpha", "feature/offline-alpha"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Validate bundled Hematology knowledge
        run: |
          count=$(find android/assets/knowledge/hematology -type f -name "*.json" | wc -l)
          test "$count" -eq 51
          echo "Validated $count Hematology JSON records"

      - name: Validate offline-only manifest
        run: |
          ! grep -Eq '<uses-permission[^>]+android:name="android.permission.INTERNET"' android-app/src/main/AndroidManifest.xml
          echo "Validated: INTERNET permission is not declared"

      - name: Build Android debug APK
        working-directory: android
        run: gradle :android-app:assembleDebug

      - name: Verify APK contains offline knowledge
        working-directory: android
        run: |
          apk=android-app/build/outputs/apk/debug/android-app-debug.apk
          test -f "$apk"
          unzip -l "$apk" > /tmp/media-apk-list.txt
          count=$(grep -E 'assets/knowledge/hematology/.+\.json$' /tmp/media-apk-list.txt | wc -l)
          echo "APK contains $count bundled Hematology JSON entries"
          test "$count" -eq 51

      - name: Verify APK metadata
        working-directory: android
        run: |
          apk=android-app/build/outputs/apk/debug/android-app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | grep -F "package: name='com.media.android'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | grep -F "versionName='0.2.0'"

      - name: Run Android unit tests
        working-directory: android
        run: gradle :android-app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: media-android-alpha-debug
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          retention-days: 30