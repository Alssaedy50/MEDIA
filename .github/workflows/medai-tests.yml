name: MEDAI Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  medai-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run inference tests
        run: python -m unittest discover -s inference -p 'test_*.py' -v
      - name: Run evaluation tests
        run: python -m unittest discover -s evaluation -p 'test_*.py' -v
      - name: Run Anatomy evaluation report
        run: python evaluation/run_evaluation.py
