name: MEDAI Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  medai-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run inference tests
        run: python -m unittest discover -s inference -p 'test_*.py' -v
      - name: Install Web/API dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Run Web/API tests
        run: python -m unittest app/api/test_main.py -v
      - name: Run evaluation tests
        run: python -m unittest discover -s evaluation -p 'test_*.py' -v
      - name: Run training pipeline tests
        working-directory: training
        run: python -m unittest test_build_dataset.py -v
      - name: Run corpus validator tests
        run: python -m unittest training/test_validate_corpus.py -v
      - name: Run tokenizer foundation tests
        run: python -m unittest training/test_tokenizer.py -v
      - name: Install model dependencies
        run: python -m pip install -r model/requirements.txt
      - name: Run model foundation tests
        run: python -m unittest model/test_config.py model/test_transformer.py model/test_size.py -v
      - name: Generate Hematology training dataset
        run: python training/build_dataset.py
      - name: Validate generated corpus
        run: python training/validate_corpus.py datasets/hematology/train.jsonl datasets/hematology/validation.jsonl datasets/hematology/test.jsonl
      - name: Run corpus analysis unit tests
        run: python -m unittest training/test_analyze_corpus.py -v
      - name: Run tokenizer audit unit tests
        run: python -m unittest training/test_tokenizer_audit.py -v
      - name: Run tokenizer benchmark unit tests
        run: python -m unittest training/test_tokenizer_benchmark.py -v
      - name: Run model foundation selector tests
        run: python -m unittest training/test_select_model_spec.py -v
      - name: Run corpus analysis
        run: python training/analyze_corpus.py --output datasets/hematology/corpus_analysis.json
      - name: Build tokenizer artifact
        run: python training/tokenizer.py datasets/hematology/train.jsonl --vocab-size 4096 --output datasets/hematology/tokenizer.json
      - name: Run exact tokenizer audit
        run: python training/tokenizer_audit.py datasets/hematology/train.jsonl datasets/hematology/validation.jsonl datasets/hematology/test.jsonl --tokenizer datasets/hematology/tokenizer.json --output datasets/hematology/tokenizer_audit.json
      - name: Benchmark candidate tokenizer vocabularies
        run: python training/tokenizer_benchmark.py datasets/hematology/train.jsonl datasets/hematology/validation.jsonl datasets/hematology/test.jsonl --vocab-sizes 4096 8192 16384 32768 50000 --output datasets/hematology/tokenizer_benchmark.json
      - name: Verify tokenizer benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("datasets/hematology/tokenizer_benchmark.json").read_text())
          assert len(data["results"]) == 5, data
          assert all(r["unknown_token_count"] == 0 for r in data["results"]), data
          assert all(r["token_count_including_specials"] > 0 for r in data["results"]), data
          print(data)
          PY
      - name: Materialize candidate 100M foundation specification
        run: python training/select_model_spec.py datasets/hematology/tokenizer_benchmark.json --output model/foundation_spec.json
      - name: Verify candidate 100M foundation specification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path("model/foundation_spec.json").read_text())
          assert spec["status"] == "candidate_pending_freeze", spec
          assert 95_000_000 < spec["transformer"]["parameter_count"] < 105_000_000, spec
          assert spec["transformer"]["max_seq_len"] == 256, spec
          assert spec["transformer"]["weight_tying"] is True, spec
          assert spec["selected_tokenizer"]["actual_vocab_size"] > 0, spec
          print(json.dumps(spec, ensure_ascii=False, indent=2))
          PY
      - name: Verify tokenizer artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("datasets/hematology/tokenizer.json")
          data = json.loads(p.read_text())
          assert data["version"] == "media-bpe-v1", data
          assert len(data["vocab"]) == data["vocab_size"], data
          assert all(t in data["vocab"] for t in ["<pad>", "<unk>", "<bos>", "<eos>"]), data
          print({"vocab_size": data["vocab_size"], "merge_count": len(data["merges"])})
          audit = json.loads(Path("datasets/hematology/tokenizer_audit.json").read_text())
          assert audit["unknown_token_count"] == 0, audit
          print({"exact_token_count": audit["token_count_including_specials"], "max_tokens": audit["max_tokens"]})
          PY
      - name: Verify generated corpus manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("datasets/hematology/manifest.json")
          data = json.loads(p.read_text())
          assert data["record_count"] == 51, data
          assert data["example_count"] > 0, data
          assert data["split_counts"]["test"] >= 2, data
          print(data)
          PY
      - name: Run Anatomy evaluation report
        run: python evaluation/run_evaluation.py
      - name: Run Histology evaluation report
        run: python evaluation/run_evaluation.py --cases evaluation/histology_eval.json
      - name: Run Fetal Hematopoiesis evaluation report
        run: python evaluation/run_evaluation.py --cases evaluation/histology_fetal_eval.json
      - name: Run RBC erythropoiesis evaluation report
        run: python evaluation/run_evaluation.py --cases evaluation/histology_rbc_eval.json
      - name: Run Leukocyte evaluation report
        run: python evaluation/run_evaluation.py --cases evaluation/histology_leukocytes_eval.json
